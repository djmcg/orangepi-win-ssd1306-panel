# Serve the OLED panel from disk and proxy the REST API to the Flask app.
#
#   sudo cp deploy/nginx-oled.conf /etc/nginx/snippets/oled.conf
#   # then, inside the server{} block whose root is /var/www:
#   include snippets/oled.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Panel URL: http://<board>/oled/
# Note: keys "api_prefix" style rewrites are not needed - the backend already
# serves everything under /api/.

location = /oled {
    return 301 /oled/;
}

location /oled/ {
    alias /var/www/oled/;
    index index.html;
    try_files $uri $uri/ =404;
}

location /api/ {
    proxy_pass http://127.0.0.1:5003/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
}
